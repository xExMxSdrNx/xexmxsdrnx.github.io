<style>
body{margin:0;font-family:sans-serif;background:#eaeaea}
.header{padding:12px;font-size:18px;font-weight:bold}

.menu-bar{display:flex;gap:10px;padding:10px;justify-content:center}
.menu-bar button{
padding:6px 12px;border:none;border-radius:10px;
background:#333;color:#fff;cursor:pointer;
}

#accountMenu{text-align:center;padding:10px}
#accountMenu button{
margin:5px;padding:6px 12px;border:none;border-radius:10px;
background:#ddd;cursor:pointer;
}
#accountMenu button.active{background:#00c853;color:#fff}

.game-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;padding:12px;
}

.game-btn{
background:#fff;border-radius:18px;padding:8px;
text-align:center;cursor:pointer;height:150px;
display:flex;flex-direction:column;justify-content:space-between;
}

.game-btn img{
width:100%;height:100px;object-fit:cover;border-radius:12px;
}

.counter{
position:absolute;top:6px;right:6px;
background:#ff3d00;color:#fff;font-size:11px;
padding:2px 6px;border-radius:10px;
}

/* OVERLAY */
.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#000;display:none;flex-direction:column;
z-index:999;
}
.overlay.active{display:flex}

.topbar{
display:flex;justify-content:space-between;
padding:10px;background:#111;color:#fff;
}

iframe{flex:1;border:none}

/* POPUP */
.popup-bg{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;
z-index:999;
}
.popup-bg.active{display:block}

.popup{
position:fixed;
top:50%;left:50%;
transform:translate(-50%,-50%);
background:#fff;padding:20px;border-radius:12px;
display:none;width:85%;max-width:320px;
z-index:1000;
}
.popup.active{display:block}

.popup button{
margin-top:10px;
padding:6px 10px;
border:none;
background:#00c853;
color:#fff;
border-radius:8px;
cursor:pointer;
}

.game-btn{
transition: all 0.35s ease;
}

/* TOP 1 */
.top1{
border:3px solid gold !important;
transform:scale(1.05);
}

/* TOP 2 */
.top2{
border:3px solid silver !important;
transform:scale(1.03);
}

/* TOP 3 */
.top3{
border:3px solid #cd7f32 !important;
}

</style>
</head>

/* RENDER */
function render(){
const grid=document.getElementById('gameGrid');
grid.innerHTML='';

// gabung data
let data = GAMES.map((g,i)=>({
...g,
index:i,
count: (selectedAccount && clickCount[selectedAccount]?.[i]) || 0
}));

// sort
data.sort((a,b)=>b.count - a.count);

data.forEach((g,rank)=>{

const btn=document.createElement('div');
btn.className='game-btn';

// 🎯 TOP 3 STYLE
if(g.count > 0){
if(rank===0) btn.classList.add("top1");
else if(rank===1) btn.classList.add("top2");
else if(rank===2) btn.classList.add("top3");
}

btn.innerHTML=`
<div style="position:relative">
<img src="${g.img}">
<div class="counter">${g.count}</div>
</div>
<span>${g.n}</span>
`;

btn.onclick=()=>{

if(!selectedAccount){
alert("Pilih akun dulu!");
return;
}

if(!clickCount[selectedAccount]) clickCount[selectedAccount]={};

clickCount[selectedAccount][g.index]=(clickCount[selectedAccount][g.index]||0)+1;

localStorage.setItem("clickCount",JSON.stringify(clickCount));
localStorage.setItem("lastGame",JSON.stringify({acc:selectedAccount,i:g.index}));

render();

currentUrl=g.u+AUTH[selectedAccount]+"&lang=en";
openGame(g.n,currentUrl);
};

grid.appendChild(btn);
});
}

/* REFRESH DENGAN KONFIRMASI */
function refreshGame(){

if(!selectedAccount){
alert("Pilih akun dulu!");
return;
}

if(!confirm("Mau refresh game ini?")){
return;
}

let last = JSON.parse(localStorage.getItem("lastGame"));

if(last && last.acc === selectedAccount){

if(!clickCount[selectedAccount]) clickCount[selectedAccount]={};

clickCount[selectedAccount][last.i]=(clickCount[selectedAccount][last.i]||0)+1;

localStorage.setItem("clickCount",JSON.stringify(clickCount));
}

// reload iframe
document.getElementById('frame').src=currentUrl;

render();
}

/* STATISTIK */
function showStats(){
if(!selectedAccount) return alert("Pilih akun dulu!");

let data = GAMES.map((g,i)=>({
name:g.n,
count:clickCount[selectedAccount]?.[i]||0
}))
.filter(d=>d.count>0)
.sort((a,b)=>b.count-a.count);

let html="<b>📊 Statistik</b><br><br>";

if(data.length===0){
html+="Belum ada data";
}else{

// 🔥 TOP 10
let top = data.slice(0,10);

top.forEach((d,i)=>{
html+=`${i+1}. ${d.name} — <b>${d.count}</b><br>`;
});

// 📦 SISANYA
let rest = data.slice(10);
if(rest.length>0){
let oneClick = rest.filter(d=>d.count===1).length;
let moreThanOne = rest.filter(d=>d.count>1);

if(moreThanOne.length>0){
html+="<br><b>Lainnya:</b><br>";
moreThanOne.forEach(d=>{
html+=`${d.name} — ${d.count}<br>`;
});
}

if(oneClick>0){
html+=`<br>+ ${oneClick} game lain (1 klik)`;
}
}

}

html+=`<br><br><button onclick="closePopup()">Tutup</button>`;
showPopup(html);
}

});
}

html+=`<br><button onclick="closePopup()">Tutup</button>`;
showPopup(html);
}

/* RESET */
function resetData(){
if(confirm("Reset semua data?")){
clickCount={};
localStorage.clear();
render();
}
}

/* POPUP */
function showPopup(html){
document.getElementById("popup").innerHTML=html;
document.getElementById("popup").classList.add("active");
document.getElementById("popupBg").classList.add("active");
}

function closePopup(){
document.getElementById("popup").classList.remove("active");
document.getElementById("popupBg").classList.remove("active");
}

/* CONTROL */
function selectAccount(acc,btn){
selectedAccount=acc;
document.querySelectorAll('#accountMenu button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
render();
}

function openGame(n,u){
document.getElementById('overlay').classList.add('active');
document.getElementById('frame').src=u;
document.getElementById('title').innerText=n+" | "+ACCOUNT_NAME[selectedAccount];
}

function closeGame(){
document.getElementById('overlay').classList.remove('active');
document.getElementById('frame').src='';
}

window.onload=()=>{
render();
};

</script>

</body>
</html>
