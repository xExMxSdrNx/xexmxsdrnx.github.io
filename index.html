<style>
body{margin:0;font-family:sans-serif;background:#eaeaea}

/* HEADER */
.header{padding:12px;font-size:18px;font-weight:bold}

/* AKUN */
#accountMenu{text-align:center;padding:10px}
#accountMenu button{
margin:5px;padding:6px 12px;border:none;border-radius:10px;
background:#ddd;cursor:pointer;
}
#accountMenu button.active{
background:#00c853;color:#fff;
}

/* GRID */
.game-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
padding:12px;
}

/* CARD */
.game-btn{
background:#fff;
border-radius:18px;
padding:8px;
text-align:center;
cursor:pointer;
transition:0.2s;
height:150px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.game-btn:hover{
transform:translateY(-6px);
box-shadow:0 10px 18px rgba(0,0,0,0.2);
}

.game-btn:active{
transform:scale(0.95);
}

/* GAMBAR FIX */
.game-btn img{
width:100%;
height:100px;
object-fit:cover;
border-radius:12px;
transition:0.3s;
}

.game-btn:hover img{
transform:scale(1.05);
}

.game-btn span{
font-size:13px;
color:#333;
}

/* OVERLAY */
.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#000;display:none;flex-direction:column;
}
.overlay.active{display:flex}

.topbar{
display:flex;justify-content:space-between;
padding:10px;background:#111;color:#fff;
}

iframe{flex:1;border:none}
</style>

/* ================= RENDER ================= */
function render(){
const grid=document.getElementById('gameGrid');
grid.innerHTML='';

GAMES.forEach(g=>{
const btn=document.createElement('div');
btn.className='game-btn';

btn.innerHTML=`
<img src="${g.img}" 
onerror="this.src='https://cdn-icons-png.flaticon.com/512/565/565547.png'">
<span>${g.n}</span>
`;

btn.onclick=()=>{
if(!selectedAccount){
alert("Pilih akun dulu!");
return;
}
currentUrl=g.u+AUTH[selectedAccount]+"&lang=en";
openGame(g.n,currentUrl);
};

grid.appendChild(btn);
});
}

/* ================= CONTROL ================= */
function selectAccount(acc,btn){
selectedAccount=acc;
document.querySelectorAll('#accountMenu button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}

function openGame(n,u){
document.getElementById('overlay').classList.add('active');
document.getElementById('frame').src=u;

const acc=ACCOUNT_NAME[selectedAccount]||'';
document.getElementById('title').innerText=n+" | "+acc;
}

function closeGame(){
document.getElementById('overlay').classList.remove('active');
document.getElementById('frame').src='';
}

function refreshGame(){
document.getElementById('frame').src=currentUrl;
}

render();
