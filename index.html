<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Super Mario Sederhana - Lompat & Hindari Goomba</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0a2f5a 0%, #0a1f3a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', 'VT323', monospace;
        }

        .game-container {
            background: #000;
            border-radius: 28px;
            padding: 12px 12px 14px 12px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 4px rgba(255,255,255,0.2);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 0 3px #f7d44a, 0 0 0 6px #b45f1b;
            cursor: pointer;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 14px;
            margin-bottom: 8px;
            padding: 5px 18px;
            background: #1e1a0e;
            border-radius: 60px;
            color: #f8e45c;
            text-shadow: 2px 2px 0 #6b2e00;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .score-box, .best-box {
            background: #2c2416;
            padding: 4px 16px;
            border-radius: 32px;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
        }

        button {
            background: #f5bc70;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            font-family: monospace;
            padding: 8px 24px;
            border-radius: 60px;
            box-shadow: 0 6px 0 #8b5a2b;
            cursor: pointer;
            transition: 0.07s linear;
            color: #3c2400;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8b5a2b;
        }

        .restart-btn {
            background: #e0a800;
            font-size: 1.3rem;
            padding: 6px 20px;
        }

        .status {
            background: #000000aa;
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffd966;
        }

        @media (max-width: 550px) {
            .info-panel { font-size: 1rem; padding: 4px 12px; }
            button { padding: 5px 16px; font-size: 1.3rem; }
            .score-box, .best-box { padding: 2px 12px; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="info-panel">
            <div class="score-box">⭐ SCORE: <span id="scoreValue">0</span></div>
            <div class="best-box">🏆 BEST: <span id="bestValue">0</span></div>
            <div class="status" id="gameStatusText">▶️ BERJALAN</div>
        </div>
        <div class="controls">
            <button id="jumpBtn">⬆️ LOMPAT</button>
            <button id="restartBtn" class="restart-btn">🔄 RESTART</button>
        </div>
        <div style="text-align: center; margin-top: 12px; font-size: 12px; color:#bba87a;">Tekan SPACE / Klik Lompat | Hindari musuh hijau</div>
    </div>
</div>

<script>
    (function(){
        // --- KONFIGURASI CANVAS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Ukuran tetap 800x400
        const W = 800;
        const H = 400;
        
        // --- GROUND ---
        const GROUND_Y = H - 42;    // tanah (dasar lantai)
        const PLAYER_WIDTH = 30;
        const PLAYER_HEIGHT = 30;
        
        // --- PARAMETER MARIO (player) ---
        let player = {
            x: 70,
            y: GROUND_Y - PLAYER_HEIGHT,  // berdiri di tanah
            width: PLAYER_WIDTH,
            height: PLAYER_HEIGHT,
            vy: 0,
            gravity: 0.8,
            jumpPower: -11,
            grounded: true
        };
        
        // --- MUSUH (Goomba sederhana) ---
        let enemies = [];
        const ENEMY_W = 28;
        const ENEMY_H = 28;
        let frameCounter = 0;
        let spawnGap = 70;      // frame antar spawn
        let baseSpawnGap = 70;
        
        // --- GAME STATE ---
        let score = 0;
        let bestScore = 0;
        let gameRunning = true;
        
        // --- SKOR & UI elements ---
        const scoreSpan = document.getElementById('scoreValue');
        const bestSpan = document.getElementById('bestValue');
        const statusDiv = document.getElementById('gameStatusText');
        
        // Muat best score dari localStorage
        if(localStorage.getItem('marioBestScore')){
            bestScore = parseInt(localStorage.getItem('marioBestScore')) || 0;
            bestSpan.innerText = bestScore;
        }
        
        // --- FUNGSI BANTU ---
        function updateUI(){
            scoreSpan.innerText = Math.floor(score);
            if(Math.floor(score) > bestScore){
                bestScore = Math.floor(score);
                bestSpan.innerText = bestScore;
                localStorage.setItem('marioBestScore', bestScore);
            }
        }
        
        // restart game
        function restartGame(){
            gameRunning = true;
            score = 0;
            updateUI();
            statusDiv.innerText = "▶️ BERJALAN";
            enemies = [];
            frameCounter = 0;
            player.y = GROUND_Y - PLAYER_HEIGHT;
            player.vy = 0;
            player.grounded = true;
            spawnGap = baseSpawnGap;
        }
        
        // lompat
        function playerJump(){
            if(!gameRunning) return;
            if(player.grounded){
                player.vy = player.jumpPower;
                player.grounded = false;
            }
        }
        
        // update logika
        function updateGame(){
            if(!gameRunning) return;
            
            // 1. Update Mario gravity & posisi Y
            player.vy += player.gravity;
            player.y += player.vy;
            
            // deteksi tanah
            if(player.y >= GROUND_Y - PLAYER_HEIGHT){
                player.y = GROUND_Y - PLAYER_HEIGHT;
                player.vy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }
            
            // batas atas
            if(player.y < 0){
                player.y = 0;
                if(player.vy < 0) player.vy = 0;
            }
            
            // 2. Update posisi musuh (bergerak ke kiri)
            for(let i=0; i<enemies.length; i++){
                enemies[i].x -= enemies[i].speed;
            }
            // hapus musuh yang keluar layar
            enemies = enemies.filter(e => e.x + e.w > 0);
            
            // 3. Spawn musuh secara periodik
            let dynamicGap = Math.max(35, baseSpawnGap - Math.floor(score / 250));
            if(frameCounter >= dynamicGap){
                frameCounter = 0;
                let moveSpeed = 3.2 + Math.min(4.0, Math.floor(score / 450));
                enemies.push({
                    x: W,
                    y: GROUND_Y - ENEMY_H + 2,
                    w: ENEMY_W,
                    h: ENEMY_H,
                    speed: moveSpeed
                });
            } else {
                frameCounter++;
            }
            
            // 4. Deteksi tabrakan
            for(let i=0; i<enemies.length; i++){
                const e = enemies[i];
                if(player.x < e.x + e.w &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.h &&
                    player.y + player.height > e.y){
                    gameRunning = false;
                    statusDiv.innerText = "💀 GAME OVER 💀";
                    break;
                }
            }
            
            // 5. Tambah skor
            if(gameRunning){
                score += 0.25;
                updateUI();
            }
        }
        
        // --- GAMBAR SEMUA ELEMEN ---
        function drawGround(){
            // tanah
            ctx.fillStyle = "#7a4316";
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y + 2);
            // garis atas tanah
            ctx.fillStyle = "#b87c3a";
            ctx.fillRect(0, GROUND_Y-5, W, 6);
            ctx.fillStyle = "#e3a56d";
            ctx.fillRect(0, GROUND_Y-2, W, 4);
            // rumput
            ctx.fillStyle = "#5c9e3e";
            for(let i=0; i<15; i++){
                ctx.fillRect(i*55+10, GROUND_Y-10, 7, 12);
            }
        }
        
        // gambar Mario
        function drawMario(x, y, w, h){
            // badan overall merah
            ctx.fillStyle = "#e32119";
            ctx.fillRect(x, y, w, h);
            
            // wajah (skin)
            ctx.fillStyle = "#fcd7a0";
            ctx.fillRect(x+4, y-6, w-8, 12);
            
            // topi merah
            ctx.fillStyle = "#c22";
            ctx.fillRect(x+2, y-10, w-4, 8);
            ctx.fillStyle = "#ff4444";
            ctx.fillRect(x+3, y-9, w-6, 6);
            
            // logo M di topi
            ctx.fillStyle = "#fff";
            ctx.font = "bold 12px 'Courier New'";
            ctx.fillText("M", x+11, y-4);
            
            // kumis
            ctx.fillStyle = "#4a2a0a";
            ctx.fillRect(x+6, y+3, 7, 3);
            ctx.fillRect(x+17, y+3, 7, 3);
            
            // mata
            ctx.fillStyle = "#000";
            ctx.fillRect(x+9, y-2, 3, 4);
            ctx.fillRect(x+18, y-2, 3, 4);
            
            // alis
            ctx.fillStyle = "#2a1a05";
            ctx.fillRect(x+7, y-5, 6, 2);
            ctx.fillRect(x+17, y-5, 6, 2);
            
            // kancing overall
            ctx.fillStyle = "#ffd966";
            ctx.beginPath();
            ctx.arc(x+15, y+13, 3.5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#c97e2a";
            ctx.fillRect(x+5, y+19, 6, 9);
            ctx.fillRect(x+19, y+19, 6, 9);
            
            // sepatu coklat
            ctx.fillStyle = "#8b4513";
            ctx.fillRect(x+3, y+h-5, 8, 6);
            ctx.fillRect(x+19, y+h-5, 8, 6);
        }
        
        // gambar musuh Goomba
        function drawGoomba(x, y, w, h){
            // badan
            ctx.fillStyle = "#6b3e1c";
            ctx.beginPath();
            ctx.ellipse(x+w/2, y+h/2, w/2, h/2.2, 0, 0, Math.PI*2);
            ctx.fill();
            
            // mata
            ctx.fillStyle = "#2a1a06";
            ctx.beginPath();
            ctx.ellipse(x+w/3, y+h/2-3, 5, 6, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x+2*w/3, y+h/2-3, 5, 6, 0, 0, Math.PI*2);
            ctx.fill();
            
            // putih mata
            ctx.fillStyle = "#fff8e7";
            ctx.beginPath();
            ctx.arc(x+w/3-1, y+h/2-4, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x+2*w/3-1, y+h/2-4, 2, 0, Math.PI*2);
            ctx.fill();
            
            // alis
            ctx.fillStyle = "#1f1204";
            ctx.fillRect(x+6, y+h/2-7, 7, 3);
            ctx.fillRect(x+15, y+h/2-7, 7, 3);
            
            // mulut
            ctx.fillStyle = "#4a2a10";
            ctx.fillRect(x+9, y+h/2+2, 10, 4);
            
            // kaki
            ctx.fillStyle = "#4a2a10";
            ctx.fillRect(x+4, y+h-5, 7, 5);
            ctx.fillRect(x+17, y+h-5, 7, 5);
        }
        
        function drawBackground(){
            // langit gradien
            const grad = ctx.createLinearGradient(0,0,0,250);
            grad.addColorStop(0,"#5bb4ff");
            grad.addColorStop(1,"#9ad4ff");
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,W,GROUND_Y-8);
            
            // awan
            ctx.fillStyle = "#ffffffdd";
            // awan kiri
            ctx.beginPath();
            ctx.ellipse(100, 55, 38, 32, 0, 0, Math.PI*2);
            ctx.ellipse(135, 42, 42, 35, 0, 0, Math.PI*2);
            ctx.ellipse(175, 55, 35, 30, 0, 0, Math.PI*2);
            ctx.fill();
            
            // awan kanan
            ctx.beginPath();
            ctx.ellipse(620, 65, 40, 34, 0, 0, Math.PI*2);
            ctx.ellipse(665, 52, 44, 37, 0, 0, Math.PI*2);
            ctx.ellipse(705, 68, 36, 32, 0, 0, Math.PI*2);
            ctx.fill();
            
            // awan kecil
            ctx.beginPath();
            ctx.ellipse(400, 35, 30, 25, 0, 0, Math.PI*2);
            ctx.ellipse(430, 28, 28, 23, 0, 0, Math.PI*2);
            ctx.fill();
            
            // matahari
            ctx.fillStyle = "#ffdd77";
            ctx.beginPath();
            ctx.arc(730, 50, 28, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#ffcc44";
            for(let i=0; i<12; i++){
                let angle = i * Math.PI * 2 / 12;
                let x = 730 + Math.cos(angle) * 38;
                let y = 50 + Math.sin(angle) * 38;
                ctx.fillRect(x-3, y-2, 6, 5);
            }
            
            // semak
            ctx.fillStyle = "#3e7a2a";
            ctx.beginPath();
            ctx.ellipse(480, GROUND_Y-14, 45, 24, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#2d5a1e";
            ctx.beginPath();
            ctx.ellipse(510, GROUND_Y-20, 38, 22, 0, 0, Math.PI*2);
            ctx.fill();
        }
        
        function drawScoreEffects(){
            ctx.font = "bold 28px 'Courier New'";
            ctx.fillStyle = "#ffdd77";
            ctx.shadowBlur = 0;
            ctx.fillText("★", 22, 52);
            ctx.font = "bold 18px monospace";
            ctx.fillStyle = "#ffeeaa";
            ctx.fillText("x " + Math.floor(score), 55, 58);
            
            // petunjuk lompat
            if(player.grounded && gameRunning){
                ctx.font = "italic 12px monospace";
                ctx.fillStyle = "#ffffbb";
                ctx.fillText("▶ LOMPAT!", player.x-5, player.y-12);
            }
        }
        
        // --- LOOP UTAMA ---
        function gameLoop(){
            updateGame();
            
            // gambar semua
            drawBackground();
            drawGround();
            
            // gambar musuh
            for(let e of enemies){
                drawGoomba(e.x, e.y, e.w, e.h);
            }
            
            // bayangan Mario
            ctx.fillStyle = "#2a1a0a90";
            ctx.beginPath();
            ctx.ellipse(player.x+player.width/2+2, GROUND_Y+3, player.width/2+3, 7, 0, 0, Math.PI*2);
            ctx.fill();
            
            // gambar Mario
            drawMario(player.x, player.y, player.width, player.height);
            
            // efek game over
            if(!gameRunning){
                ctx.font = "bold 36px 'Courier New', monospace";
                ctx.fillStyle = "#e03030";
                ctx.shadowColor = "#3a1a00";
                ctx.fillText("GAME OVER", W/2-115, H/2-45);
                ctx.font = "18px monospace";
                ctx.fillStyle = "#ffecb3";
                ctx.fillText("Klik RESTART untuk main lagi", W/2-140, H/2+25);
            }
            
            drawScoreEffects();
            
            // animasi bounce saat grounded
            if(player.grounded && gameRunning && player.vy === 0){
                ctx.fillStyle = "#ffdd99";
                ctx.beginPath();
                ctx.moveTo(player.x+5, player.y+player.height+2);
                ctx.lineTo(player.x+15, player.y+player.height+9);
                ctx.lineTo(player.x+25, player.y+player.height+2);
                ctx.fill();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // --- EVENT HANDLER ---
        function handleKey(e){
            const key = e.key;
            if(key === ' ' || key === 'Space' || key === 'ArrowUp'){
                e.preventDefault();
                playerJump();
            }
            if(key === 'r' || key === 'R'){
                e.preventDefault();
                restartGame();
            }
        }
        
        window.addEventListener('keydown', handleKey);
        
        const jumpBtn = document.getElementById('jumpBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        jumpBtn.addEventListener('click', (e) => {
            e.preventDefault();
            playerJump();
        });
        
        restartBtn.addEventListener('click', (e) => {
            e.preventDefault();
            restartGame();
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playerJump();
        });
        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            playerJump();
        });
        
        // mulai game
        restartGame();
        gameLoop();
    })();
</script>
</body>
</html>
