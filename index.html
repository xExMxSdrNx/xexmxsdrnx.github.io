<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Sayangku ❤️</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #ff4d6d);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    overflow: hidden;
}

.container {
    max-width: 320px;
}

h1 {
    font-size: 2.2em;
}

#text {
    font-size: 1.2em;
    min-height: 60px;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: white;
    color: #ff4d6d;
    font-weight: bold;
    cursor: pointer;
}

/* efek klimaks */
.big {
    font-size: 1.6em;
    font-weight: bold;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* hati */
.heart {
    position: absolute;
    font-size: 16px;
    animation: naik 4s linear forwards;
}

@keyframes naik {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-250px); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
    <h1>Hai Sayangku ❤️</h1>
    <p id="text">Klik dulu ya 😊</p>
    <button id="btn">Klik 💌</button>
</div>

<script>

// ================= PESAN AWAL =================
const pesan = [
    "Sayang...",
    "Aku nggak tau harus mulai dari mana...",
    "Kadang aku mikir...",
    "gimana bisa aku sedeket ini sama pean sekarang...",
    "Padahal dulu kita cuma orang asing 😊",
    
    "Dan sekarang...",
    "pean jadi orang yang paling sering aku pikirin...",
    "yang paling sering aku tunggu kabarnya...",
    
    "Aku tahu...",
    "kita nggak selalu baik-baik aja...",
    "kadang ada salah...",
    "kadang ada diam...",
    
    "Tapi anehnya...",
    "aku nggak pernah benar-benar pengen jauh dari pean 🤗",
    
    "Karena setiap hari...",
    "aku selalu milih pean..."
];

let i = 0;

// ================= EFEK NGETIK =================
function ketik(teks, selesai){
    const el = document.getElementById("text");
    el.innerHTML = "";
    let idx = 0;

    const interval = setInterval(()=>{
        el.innerHTML += teks[idx];
        idx++;

        if(idx >= teks.length){
            clearInterval(interval);
            setTimeout(selesai, 1800);
        }
    }, 80); // makin besar = makin pelan
}

// ================= JALAN CERITA =================
function jalan(){
    if(i < pesan.length){
        ketik(pesan[i], ()=>{
            i++;
            jalan();
        });
    } else {
        klimaks();
    }
}

// ================= KLIMAKS PANJANG =================
function klimaks(){
    const ending = [
        "Dan akhirnya aku sadar...",
        "perasaan ini nggak sesederhana yang aku kira...",
        
        "Aku nggak cuma nyaman sama pean...",
        
        "Aku bener-bener sayang sama pean ❤️",
        
        "Sayang yang nggak cuma datang sesaat...",
        "tapi yang selalu ada, bahkan di hari biasa...",
        
        "Aku suka semua tentang pean...",
        "cara pean ngomong...",
        "cara pean perhatian...",
        
        "Dan kalau aku harus milih lagi...",
        
        "aku bakal tetap milih pean...",
        "lagi...",
        "dan lagi...",
        
        "bukan karena nggak ada pilihan lain...",
        
        "tapi karena pean yang aku mau 🤗",
        
        "Aku sayang pean...",
        "hari ini...",
        "besok...",
        "dan seterusnya ❤️",
        "i Love you sayangku (Novia) #masRoso 💕"
    ];

    let j = 0;

    function jalanEnding(){
        if(j < ending.length){
            ketik(ending[j], ()=>{
                j++;
                jalanEnding();
            });
        } else {
            document.getElementById("text").classList.add("big");
            efekHati();
        }
    }

    jalanEnding();
}

// ================= EFEK HATI =================
function efekHati(){
    setInterval(()=>{
        const h = document.createElement("div");
        h.className = "heart";
        h.innerHTML = "❤️";

        h.style.left = Math.random()*100 + "vw";
        h.style.bottom = "0px";

        document.body.appendChild(h);

        setTimeout(()=>h.remove(),4000);
    }, 300);
}

// ================= START =================
document.getElementById("btn").addEventListener("click", function(){
    this.style.display = "none";
    jalan();
});

</script>

</body>
</html>
