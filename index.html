<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Full Frame</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.frame-wrap{
    width:100%;
    height:100vh;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>
<body>

<div class="frame-wrap">
    <iframe 
        src="https://www.blowjobs.pro"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
