<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>
<body>

<iframe id="frame"></iframe>

<script>
const url = "https://blowjobs.pro/";

document.getElementById("frame").src = url;

// fallback kalau iframe diblok
setTimeout(()=>{
    try{
        if(
            document.getElementById("frame")
            .contentWindow.location.href === "about:blank"
        ){
            window.location.href = url;
        }
    }catch(e){
        // jika diblok security browser
        window.location.href = url;
    }
},1500);
</script>

</body>
</html>
