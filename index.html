<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Speed Racing - AI Sequence Predictor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#020617;
    color:white;
}

/* HEADER GAME */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:55px;
    background:#0f111a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    z-index:100;
    border-bottom:1px solid #1e2438;
}
.logo{
    font-size:20px;
    font-weight:800;
}
.logo span{
    color:#3b82f6;
}
.search{
    width:130px;
    height:36px;
    background:#1a1f2e;
    border:none;
    border-radius:20px;
    padding:0 12px;
    color:#fff;
    font-size:12px;
    outline:none;
}

/* HOME */
#home{
    position:absolute;
    top:55px;
    left:0;
    width:100%;
    height:calc(100vh - 120px);
    overflow-y:auto;
    padding:12px;
}
.section{
    margin-bottom:20px;
}
.sectionHead{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}
.sectionTitle{
    font-size:16px;
    font-weight:700;
}
.scroll{
    display:flex;
    gap:12px;
    overflow-x:auto;
}
.scroll::-webkit-scrollbar{
    display:none;
}
.card-game{
    min-width:140px;
    background:#131725;
    border-radius:20px;
    overflow:hidden;
    border:1px solid #1e2438;
    cursor:pointer;
    position:relative;
}
.card-game:active{
    transform:scale(0.96);
}
.thumb{
    width:100%;
    height:140px;
    object-fit:cover;
}
.shadow{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,0.9),transparent 60%);
}
.cardBody{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    padding:10px;
}
.gameName{
    font-size:12px;
    font-weight:700;
    margin-bottom:4px;
}
.badge{
    display:inline-block;
    background:#3b82f6;
    padding:3px 10px;
    border-radius:20px;
    font-size:9px;
    font-weight:700;
}

/* BOTTOM NAV */
.bottomNav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#0f111ae6;
    backdrop-filter:blur(20px);
    display:flex;
    align-items:center;
    justify-content:space-around;
    border-top:1px solid #1e2438;
    z-index:100;
}
.navItem{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:10px;
    color:#6b7280;
    cursor:pointer;
    padding:5px 10px;
    border-radius:30px;
}
.navItem.active{
    color:#3b82f6;
    background:#1a1f2e;
}
.navIcon{
    font-size:20px;
}

/* PLAYER */
#player{
    position:fixed;
    inset:0;
    background:#000;
    z-index:1000;
    display:none;
}
#player.show{
    display:block;
}
.playerTop{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:50px;
    background:#0f111a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    z-index:10;
}
.btn-back{
    width:36px;
    height:36px;
    border-radius:30px;
    background:#1e2438;
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}
.playerTitle{
    font-size:13px;
    font-weight:600;
}
#gameWrap{
    position:absolute;
    top:50px;
    left:0;
    width:100%;
    height:calc(100vh - 50px);
    background:#000;
}
#gameFrame{
    position:absolute;
    width:100%;
    height:100%;
    border:none;
    background:#000;
}

.loading{
    position:absolute;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    z-index:20;
}
.spinner{
    width:35px;
    height:35px;
    border:3px solid #1e2438;
    border-top-color:#3b82f6;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
}
@keyframes spin{
    to{ transform:rotate(360deg); }
}

/* ASISTEN PREDIKSI */
.asisten-container {
    position:fixed;
    bottom:95px;
    left:10px;
    right:10px;
    z-index:2000;
    max-height: 65%;
    overflow-y: auto;
    background:rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border-radius:20px;
    padding:16px;
    border:1px solid #3b82f640;
}

.asisten-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}
.asisten-title{
    font-size:18px;
    font-weight:bold;
    color:#facc15;
}
.toggle-btn{
    background:#172554;
    border:none;
    color:white;
    font-size:16px;
    width:70px;
    height:34px;
    border-radius:10px;
    cursor:pointer;
}

.asisten-content{
    display:block;
}
.asisten-content.collapse{
    display:none;
}

.grid-buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin-bottom:20px;
}

.btn-prediksi{
    padding:10px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}
.btn-prediksi:active{
    transform:scale(0.95);
    background:#3b82f6;
}

.predicts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}
.predict{
    background:#0f766e;
    padding:15px;
    border-radius:16px;
    text-align:center;
    cursor:pointer;
}
.predict:active{
    transform:scale(0.96);
}
.predict h3{
    font-size:24px;
}
.predict p{
    margin-top:5px;
    opacity:.8;
    font-size:11px;
}

.history-list{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding-bottom:10px;
    margin-bottom:15px;
}
.history-item{
    min-width:45px;
    padding:8px;
    border-radius:8px;
    background:#1e293b;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}
.history-item.latest{
    background:#2563eb;
}

.analysis-log{
    background:#020617;
    padding:12px;
    border-radius:12px;
    font-size:12px;
    line-height:1.6;
    margin-bottom:12px;
}

.import-export{
    display:flex;
    gap:10px;
}
.import-btn, .export-btn, .reset-btn{
    flex:1;
    padding:10px;
    background:#374151;
    border:none;
    border-radius:12px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
.import-btn:hover, .export-btn:hover, .reset-btn:hover{
    background:#4b5563;
}
.reset-btn{
    background:#7f1d1d;
}
.reset-btn:hover{
    background:#991b1b;
}

/* Statistik */
.statistik{
    display:flex;
    justify-content:space-around;
    margin-top:15px;
    padding-top:12px;
    border-top:1px solid #334155;
}
.stat-item{
    text-align:center;
}
.stat-label{
    font-size:10px;
    color:#94a3b8;
}
.stat-value{
    font-size:18px;
    font-weight:bold;
}
.stat-value.benar{ color:#22c55e; }
.stat-value.salah{ color:#ef4444; }

/* MODAL KONFIRMASI */
.modal-confirm {
    position: fixed;
    bottom: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    background: #1e293b;
    border-radius: 20px;
    padding: 20px;
    z-index: 20000;
    min-width: 280px;
    text-align: center;
    border: 1px solid #facc15;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    animation: modalPop 0.2s ease;
}
@keyframes modalPop {
    0% { transform: translate(-50%, 50%) scale(0.9); opacity: 0; }
    100% { transform: translate(-50%, 50%) scale(1); opacity: 1; }
}
.modal-confirm p {
    margin-bottom: 20px;
    font-size: 16px;
}
.modal-confirm .modal-value {
    color: #facc15;
    font-weight: bold;
    font-size: 20px;
}
.modal-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
}
.modal-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
}
.modal-btn.yakin {
    background: #22c55e;
    color: white;
}
.modal-btn.batal {
    background: #ef4444;
    color: white;
}
.modal-timer {
    margin-top: 12px;
    font-size: 12px;
    color: #94a3b8;
}
</style>
</head>

<div id="app">
    <div class="header">

                    <div class="stat-label">📊 AKURASI</div>
                    <div class="stat-value" id="statAkurasi">0%</div>
                </div>
            </div>
        </div>
    </div>
</div>

// ============ MODAL KONFIRMASI ============
function showConfirmModal(value, onConfirm, onCancel) {
    if(confirmModal) closeConfirmModal();
    
    const modal = document.createElement("div");
    modal.className = "modal-confirm";
    modal.innerHTML = `
        <p>⚠️ Yakin ingin input <span class="modal-value">${value}</span> ?</p>
        <div class="modal-buttons">
            <button class="modal-btn yakin" id="modalYakin">✅ Yakin</button>
            <button class="modal-btn batal" id="modalBatal">❌ Batal</button>
        </div>
        <div class="modal-timer">⏱️ Auto yakin dalam <span id="timerCount">3</span> detik</div>
    `;
    document.body.appendChild(modal);
    confirmModal = modal;
    
    let timerLeft = 3;
    const timerSpan = modal.querySelector("#timerCount");
    
    const timer = setInterval(() => {
        timerLeft--;
        if(timerSpan) timerSpan.innerText = timerLeft;
        if(timerLeft <= 0) {
            clearInterval(timer);
            closeConfirmModal();
            onConfirm();
        }
    }, 1000);
    confirmTimer = timer;
    
    modal.querySelector("#modalYakin").onclick = () => {
        clearInterval(confirmTimer);
        closeConfirmModal();
        onConfirm();
    };
    modal.querySelector("#modalBatal").onclick = () => {
        clearInterval(confirmTimer);
        closeConfirmModal();
        if(onCancel) onCancel();
    };
}

function closeConfirmModal() {
    if(confirmModal) confirmModal.remove();
    if(confirmTimer) clearInterval(confirmTimer);
    confirmModal = null;
    confirmTimer = null;
}

// ============ TOGGLE ASISTEN ============

        toggleAsistenBtn.innerText = "BUKA";
    } else {
        asistenContent.classList.remove("collapse");
        toggleAsistenBtn.innerText = "KECILKAN";
    }
};

// ============ STATISTIK ============
function updateStatistik() {
    let benar = predictions.filter(p => p === true).length;
    let salah = predictions.filter(p => p === false).length;
    let total = benar + salah;
    let akurasi = total === 0 ? 0 : Math.round((benar / total) * 100);
    
    statBenar.innerText = benar;
    statSalah.innerText = salah;
    statAkurasi.innerText = akurasi + "%";
}

// ============ LOAD / SAVE DATA ============
function loadData() {
    const saved = localStorage.getItem("speed_history_predictor");
    const savedPred = localStorage.getItem("speed_predictions");
    
    if(saved) {
        try {
            history = JSON.parse(saved);
        } catch(e) { history = [...DEFAULT_HISTORY]; }
    } else {
        history = [...DEFAULT_HISTORY];
    }
    
    if(savedPred) {
        try {
            predictions = JSON.parse(savedPred);
        } catch(e) { predictions = []; }
    } else {
        predictions = [];
    }
    
    renderHistory();
    predictNext();
    updateStatistik();
}

function saveData() {
    localStorage.setItem("speed_history_predictor", JSON.stringify(history));
    localStorage.setItem("speed_predictions", JSON.stringify(predictions));
}

// ============ RENDER HISTORY (TERBARU DI KIRI) ============
function renderHistory() {
    if(!historyListDiv) return;
    historyListDiv.innerHTML = "";
    const last10 = history.slice(-10).reverse();
    last10.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "history-item";
        if(idx === 0) div.classList.add("latest");
        div.innerText = item;
        historyListDiv.appendChild(div);
    });
}

// ============ PREDIKSI 2-STEP MARKOV ============
function getTop3Predictions() {
    if(history.length < 3) return null;
    
    const last1 = history[history.length - 2];
    const last2 = history[history.length - 1];
    
    const counts = {};
    OPTIONS.forEach(o => counts[o] = 0);
    let totalMatch = 0;
    
    for(let i = 0; i < history.length - 2; i++) {
        const a = history[i];
        const b = history[i+1];
        const next = history[i+2];
        
        if(a === last1 && b === last2) {
            counts[next]++;
            totalMatch++;
        }
    }
    
    if(totalMatch === 0) return null;
    
    const results = [];
    for(let key in counts) {
        if(counts[key] > 0) {
            results.push({
                item: key,
                prob: (counts[key] / totalMatch) * 100,
                count: counts[key]
            });
        }
    }
    
    results.sort((a,b) => b.prob - a.prob);
    return results.slice(0,3);
}

function predictNext() {
    if(history.length < 3) {
        predictionsDiv.innerHTML = `<div class="predict"><h3>...</h3><p>Data kurang (minimal 3)</p></div>`;
        analysisLogDiv.innerHTML = `⚠️ Masih butuh ${3 - history.length} data lagi untuk mulai prediksi.`;
        return;
    }
    
    const last1 = history[history.length - 2];
    const last2 = history[history.length - 1];
    const top3 = getTop3Predictions();
    
    if(!top3 || top3.length === 0) {
        predictionsDiv.innerHTML = `<div class="predict"><h3>❓</h3><p>Tidak ada pola</p></div>`;
        analysisLogDiv.innerHTML = `🔍 Pola <b>${last1} → ${last2}</b> belum pernah terjadi sebelumnya.<br>Masukkan lebih banyak data untuk membangun pola.`;
        return;
    }
    
    predictionsDiv.innerHTML = "";
    top3.forEach(r => {
        predictionsDiv.innerHTML += `
            <div class="predict" data-value="${r.item}">
                <h3>${r.item}</h3>
                <p>${r.prob.toFixed(1)}% (${r.count}x)</p>
            </div>
        `;
    });
    
    analysisLogDiv.innerHTML = `
        📊 Pola terakhir: <b>${last1} → ${last2}</b><br>
        🔍 Ditemukan <b>${top3.reduce((a,b)=>a+b.count,0)}</b> kejadian pola yang sama di history.<br>
        📈 Top 3: ${top3.map(r => `${r.item} (${r.count}x)`).join(', ')}
    `;
}

// ============ TAMBAH HASIL ============
function addHistory(value) {
    // Sebelum menambah, cek apakah ada prediksi yang bisa diverifikasi
    if(history.length >= 3) {
        const top3 = getTop3Predictions();
        if(top3 && top3.length > 0) {
            const isCorrect = top3.some(p => p.item === value);
            predictions.push(isCorrect);
        }
    }
    
    history.push(value);
    if(history.length > 200) history.shift();
    saveData();
    renderHistory();
    predictNext();
    updateStatistik();
}

// ============ HANDLE INPUT ============
function handleInput(value) {
    showConfirmModal(value, 
        () => addHistory(value),
        () => console.log("Input dibatalkan")
    );
}

// ============ RESET DATA ============
function resetData() {
    if(confirm("⚠️ Reset semua data? History dan statistik akan hilang!")) {
        history = [...DEFAULT_HISTORY];
        predictions = [];
        saveData();
        renderHistory();
        predictNext();
        updateStatistik();
        alert("Data telah direset!");
    }
}

// ============ EXPORT DATA ============
function exportData() {
    const exportObj = {
        history: history,
        predictions: predictions,
        exportDate: new Date().toISOString()
    };
    const dataStr = JSON.stringify(exportObj, null, 2);
    const blob = new Blob([dataStr], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `speed_predictor_data_${new Date().toISOString().slice(0,19)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    alert("Data berhasil di export!");
}

// ============ IMPORT DATA ============
function importData() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json";
    input.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const importedData = JSON.parse(event.target.result);
                if(importedData.history && Array.isArray(importedData.history)) {
                    history = importedData.history;
                    predictions = importedData.predictions || [];
                    saveData();
                    renderHistory();
                    predictNext();
                    updateStatistik();
                    alert(`Import berhasil! ${history.length} data dimuat.`);
                } else {
                    alert("Format file tidak valid!");
                }
            } catch(err) {
                alert("Gagal membaca file!");
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

// ============ BUAT TOMBOL PREDIKSI ============
function buatTombolPrediksi() {
    prediksiButtons.innerHTML = "";
    OPTIONS.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-prediksi";
        btn.innerText = opt;
        btn.onclick = () => handleInput(opt);
        prediksiButtons.appendChild(btn);
    });
}

// ============ INIT ASISTEN ============
function initAsisten() {
    buatTombolPrediksi();
    loadData();
    importDataBtn.onclick = importData;
    exportDataBtn.onclick = exportData;
    resetDataBtn.onclick = resetData;
    asistenContent.classList.remove("collapse");
    asistenCollapsed = false;
    toggleAsistenBtn.innerText = "−";
}

// ============ GAME FUNCTIONS ============
function buildUrl(base) {
    try {
        let url = new URL(base);
        url.searchParams.set("uid", AUTH.uid);
        url.searchParams.set("token", AUTH.token);
        url.searchParams.set("nickname", AUTH.nickname);
        url.searchParams.set("avatar", AUTH.avatar);
        url.searchParams.set("lang", AUTH.lang);
        return url.toString();
    } catch(e) {
        return base + `?uid=${AUTH.uid}&token=${AUTH.token}`;
    }
}

function renderGames(list) {
    const homeDiv = document.getElementById("home");
    homeDiv.innerHTML = "";
    const groups = { biru:[], hijau:[], oranye:[], ungu:[], hitam:[] };
    list.forEach(g => { if(groups[g.g]) groups[g.g].push(g); });
    const names = { biru:"💎 Slot", hijau:"🟢 DuoLe", oranye:"🟠 Olympus", ungu:"🟣 Premium", hitam:"⚫ Exclusive" };
    
    for(let key of Object.keys(groups)) {
        if(groups[key].length === 0) continue;
        const section = document.createElement("div");
        section.className = "section";
        section.innerHTML = `<div class="sectionHead"><div class="sectionTitle">${names[key]}</div><div class="sectionSub">${groups[key].length}</div></div><div class="scroll"></div>`;
        const scroll = section.querySelector(".scroll");
        groups[key].forEach(game => {
            const card = document.createElement("div");
            card.className = "card-game";
            card.style.position = "relative";
            card.innerHTML = `<img class="thumb" src="${game.img}" onerror="this.src='https://placehold.co/300x200/1e293b/3b82f6?text=${game.n}'"><div class="shadow"></div><div class="cardBody"><div class="gameName">${game.n}</div><div class="badge">PLAY</div></div>`;
            card.onclick = () => openGame(game);
            scroll.appendChild(card);
        });
        homeDiv.appendChild(section);
    }
}

function openGame(game) {
    currentGame = game;
    const playerDiv = document.getElementById("player");
    const frame = document.getElementById("gameFrame");
    const loading = document.getElementById("loading");
    const title = document.getElementById("gameTitle");
    
    playerDiv.classList.add("show");
    title.innerText = game.n;
    loading.style.display = "flex";
    
    frame.src = buildUrl(game.u);
    frame.onload = () => { loading.style.display = "none"; };
    
    if(game.isSpeedRacing) {
        asistenBox.style.display = "block";
        initAsisten();
    } else {
        asistenBox.style.display = "none";
    }
    try { document.documentElement.requestFullscreen(); } catch(e) {}
}

function closeGame() {
    document.getElementById("player").classList.remove("show");
    document.getElementById("gameFrame").src = "about:blank";
    asistenBox.style.display = "none";
    currentGame = null;
}

function reloadGame() {
    if(!currentGame) return;
    document.getElementById("loading").style.display = "flex";
    document.getElementById("gameFrame").src = buildUrl(currentGame.u);
}

// ============ EVENT ============
document.getElementById("closeGameBtn").onclick = closeGame;
document.getElementById("reloadGameBtn").onclick = reloadGame;
document.getElementById("search").oninput = (e) => {
    const q = e.target.value.toLowerCase();
    renderGames(q ? GAMES.filter(g => g.n.toLowerCase().includes(q)) : GAMES);
};
document.querySelectorAll(".navItem").forEach(item => {
    item.onclick = function() {
        document.querySelectorAll(".navItem").forEach(n => n.classList.remove("active"));
        this.classList.add("active");
        const type = this.dataset.nav;
        if(type === "home") renderGames(GAMES);
        else if(type === "games") renderGames(GAMES);
        document.getElementById("search").value = "";
    };
});

renderGames(GAMES);
</script>
</body>
